
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EsToDoList</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>

<body class="bg-[#20252C] text-[#E8EDF3] min-h-screen">

  <!-- CABEÇALHO -->
  <header class="bg-[#282F38]">
    <div class="max-w-7xl mx-auto px-4 md:px-6 py-4">

      <div class="flex items-center gap-3 md:gap-6">

        <h1 class="text-xl md:text-2xl font-bold shrink-0">
          EsToDo<span class="text-[#829DBB]">List</span>
        </h1>

        <!-- Pesquisa -->
        <input
          type="search"
          placeholder="Pesquisar tarefa..."
          class="hidden sm:block flex-1 min-w-0 bg-[#20252C] text-[#E8EDF3] placeholder:text-[#AAB6C4] border border-[#3B4653] rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-[#829DBB]"
        >

        <!-- Ícone de pesquisa -->
        <button type="button"
          class="p-2 rounded-lg hover:bg-[#323B46] transition-colors"
          aria-label="Pesquisar">

          <svg class="w-6 h-6" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
          </svg>

        </button>

        <!-- Ícone de filtro -->
        <button type="button"
          class="p-2 rounded-lg hover:bg-[#323B46] transition-colors"
          aria-label="Filtrar tarefas">

          <svg class="w-6 h-6" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M3 4h18l-7 8v7l-4 2v-9z"/>
          </svg>

        </button>

        <!-- Notificações -->
        <button type="button"
          class="p-2 rounded-lg hover:bg-[#323B46] transition-colors"
          aria-label="Notificações">

          <svg class="w-6 h-6" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
          </svg>

        </button>

        <!-- Perfil -->
        <button type="button"
          class="w-9 h-9 md:w-11 md:h-11 shrink-0 rounded-full bg-[#323B46] grid place-items-center"
          aria-label="Perfil">

          <svg class="w-6 h-6" fill="none" stroke="currentColor"
            stroke-width="1.7" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21v-2a8 8 0 0 1 16 0v2z"/>
          </svg>

        </button>

      </div>

      <!-- Pesquisa mobile -->
      <input
        type="search"
        placeholder="Pesquisar tarefa..."
        class="sm:hidden mt-3 w-full bg-[#20252C] text-[#E8EDF3] placeholder:text-[#AAB6C4] border border-[#3B4653] rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-[#829DBB]"
      >

    </div>
  </header>


  <!-- CONTEÚDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 md:px-6 py-6 grid grid-cols-1 gap-6 lg:grid-cols-[minmax(0,1fr)_22rem] lg:items-start">


    <!-- FORMULÁRIO CELULAR E TABLET -->
    <section class="lg:hidden bg-[#282F38] rounded-xl shadow-lg p-4">

      <form class="flex flex-col gap-2 sm:flex-row">

        <input
          type="text"
          placeholder="Nova tarefa"
          class="w-full sm:flex-1 min-w-0 bg-[#20252C] text-[#E8EDF3] placeholder:text-[#AAB6C4] border border-[#3B4653] rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-[#829DBB]"
        >

        <input
          type="date"
          class="w-full sm:w-40 shrink-0 bg-[#20252C] text-[#E8EDF3] border border-[#3B4653] rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-[#829DBB]"
        >

        <select
          class="w-full sm:w-28 shrink-0 bg-[#20252C] text-[#E8EDF3] border border-[#3B4653] rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-[#829DBB]">

          <option value="baixa">Baixa</option>
          <option value="media" selected>Média</option>
          <option value="alta">Alta</option>

        </select>

        <button type="button"
          class="bg-[#829DBB] text-[#20252C] font-semibold hover:bg-[#91AAC5] transition-colors rounded-lg px-4 py-3 shrink-0">

          Adicionar

        </button>

      </form>

    </section>


    <!-- LISTA DE TAREFAS -->
    <section class="min-w-0">

      <!-- CABEÇALHO DA LISTA -->
      <div class="flex items-center justify-between gap-3 mb-4">

        <h2 class="text-lg font-semibold">
          Minhas tarefas
        </h2>

        <div class="flex items-center gap-2">

          <!-- Calendário -->
          <button type="button"
            class="p-2 rounded-lg bg-[#282F38] hover:bg-[#323B46] transition-colors"
            aria-label="Calendário"
            title="Calendário">

            <svg class="w-5 h-5" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" viewBox="0 0 24 24">

              <rect x="3" y="5" width="18" height="16" rx="2"/>
              <path d="M16 3v4M8 3v4M3 10h18"/>

            </svg>

          </button>

          <!-- Ordenar -->
          <button type="button"
            class="p-2 rounded-lg bg-[#282F38] hover:bg-[#323B46] transition-colors"
            aria-label="Ordenar por prazo"
            title="Ordenar por prazo">

            <svg class="w-5 h-5" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" viewBox="0 0 24 24">

              <path d="M4 6h16M7 12h10M10 18h4"/>

            </svg>

          </button>

        </div>

      </div>


      <!-- FILTROS -->
      <div class="flex gap-2 mb-4">

        <button type="button"
          class="flex-1 rounded-lg px-3 py-2 text-sm font-medium bg-[#829DBB] text-[#20252C]">

          Todas

        </button>

        <button type="button"
          class="flex-1 rounded-lg px-3 py-2 text-sm font-medium bg-[#323B46] text-[#E8EDF3] hover:bg-[#414D5B] transition-colors">

          Pendentes

        </button>

        <button type="button"
          class="flex-1 rounded-lg px-3 py-2 text-sm font-medium bg-[#323B46] text-[#E8EDF3] hover:bg-[#414D5B] transition-colors">

          Concluídas

        </button>

      </div>


      <!-- TAREFAS -->
      <ul class="space-y-3">

        <!-- TAREFA 01 -->
        <li class="bg-[#323B46] rounded-xl shadow-lg p-4 flex items-center justify-between gap-3">

          <div class="min-w-0 flex flex-col sm:flex-row sm:items-center sm:gap-4">

            <span class="font-medium break-words text-[#AAB6C4] line-through">
              Tarefa 01
            </span>

            <span class="text-sm text-[#AAB6C4] mt-1 sm:mt-0">
              Prazo: hoje
            </span>

            <span class="mt-1 sm:mt-0 inline-flex w-fit text-xs rounded-md px-2 py-1 bg-[#414D5B] text-[#AAB6C4]">
              Baixa
            </span>

          </div>

          <input type="checkbox" checked
            class="w-5 h-5 shrink-0 accent-[#829DBB]"
            aria-label="Concluir Tarefa 01">

        </li>


        <!-- TAREFA 02 -->
        <li class="bg-[#323B46] rounded-xl shadow-lg p-4 flex items-center justify-between gap-3">

          <div class="min-w-0 flex flex-col sm:flex-row sm:items-center sm:gap-4">

            <span class="font-medium break-words">
              Tarefa 02
            </span>

            <span class="text-sm text-[#AAB6C4] mt-1 sm:mt-0">
              Prazo: amanhã
            </span>

            <span class="mt-1 sm:mt-0 inline-flex w-fit text-xs rounded-md px-2 py-1 bg-[#77575B] text-[#E8EDF3]">
              Alta
            </span>

          </div>

          <input type="checkbox"
            class="w-5 h-5 shrink-0 accent-[#829DBB]"
            aria-label="Concluir Tarefa 02">

        </li>


        <!-- TAREFA 03 -->
        <li class="bg-[#323B46] rounded-xl shadow-lg p-4 flex items-center justify-between gap-3">

          <div class="min-w-0 flex flex-col sm:flex-row sm:items-center sm:gap-4">

            <span class="font-medium break-words">
              Tarefa 03
            </span>

            <span class="text-sm text-[#AAB6C4] mt-1 sm:mt-0">
              Prazo: 07/11
            </span>

            <span class="mt-1 sm:mt-0 inline-flex w-fit text-xs rounded-md px-2 py-1 bg-[#829DBB] text-[#20252C]">
              Média
            </span>

          </div>

          <input type="checkbox"
            class="w-5 h-5 shrink-0 accent-[#829DBB]"
            aria-label="Concluir Tarefa 03">

        </li>


        <!-- TAREFA 04 -->
        <li class="bg-[#323B46] rounded-xl shadow-lg p-4 flex items-center justify-between gap-3">

          <div class="min-w-0 flex flex-col sm:flex-row sm:items-center sm:gap-4">

            <span class="font-medium break-words">
              Tarefa 04
            </span>

            <span class="text-sm text-[#AAB6C4] mt-1 sm:mt-0">
              Prazo: 08/11
            </span>

            <span class="mt-1 sm:mt-0 inline-flex w-fit text-xs rounded-md px-2 py-1 bg-[#414D5B] text-[#AAB6C4]">
              Baixa
            </span>

          </div>

          <input type="checkbox"
            class="w-5 h-5 shrink-0 accent-[#829DBB]"
            aria-label="Concluir Tarefa 04">

        </li>

      </ul>


      <!-- CONTADOR -->
      <p class="mt-4 text-sm text-[#AAB6C4]">
        3 tarefas pendentes
      </p>

    </section>


    <!-- FORMULÁRIO NOTEBOOK E DESKTOP -->
    <aside class="hidden lg:block lg:sticky lg:top-6 lg:self-start">

      <div class="bg-[#282F38] rounded-xl shadow-lg p-5 space-y-3">

        <h2 class="text-xl font-bold">
          Nova tarefa
        </h2>

        <div>

          <label for="nome-tarefa"
            class="text-sm text-[#AAB6C4] block mb-1">
            Nome
          </label>

          <input id="nome-tarefa" type="text"
            placeholder="Nome da tarefa"
            class="w-full bg-[#20252C] text-[#E8EDF3] placeholder:text-[#AAB6C4] border border-[#3B4653] rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-[#829DBB]">

        </div>


        <div>

          <label for="descricao-tarefa"
            class="text-sm text-[#AAB6C4] block mb-1">
            Descrição
          </label>

          <textarea id="descricao-tarefa" rows="3"
            placeholder="Descrição da tarefa"
            class="w-full bg-[#20252C] text-[#E8EDF3] placeholder:text-[#AAB6C4] border border-[#3B4653] rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-[#829DBB]"></textarea>

        </div>


        <div class="grid grid-cols-2 gap-3">

          <div>

            <label for="prioridade"
              class="text-sm text-[#AAB6C4] block mb-1">
              Prioridade
            </label>

            <select id="prioridade"
              class="w-full min-w-0 bg-[#20252C] text-[#E8EDF3] border border-[#3B4653] rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-[#829DBB]">

              <option value="baixa">Baixa</option>
              <option value="media">Média</option>
              <option value="alta">Alta</option>

            </select>

          </div>


          <div>

            <label for="prazo-tarefa"
              class="text-sm text-[#AAB6C4] block mb-1">
              Prazo
            </label>

            <input id="prazo-tarefa" type="date"
              class="w-full min-w-0 bg-[#20252C] text-[#E8EDF3] border border-[#3B4653] rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-[#829DBB]">

          </div>

        </div>


        <div class="flex flex-wrap gap-2 pt-2">

          <button type="button"
            class="bg-[#829DBB] text-[#20252C] font-semibold hover:bg-[#91AAC5] transition-colors rounded-lg px-4 py-3 flex-1">

            Salvar

          </button>

          <button type="button"
            class="bg-[#323B46] text-[#E8EDF3] hover:bg-[#414D5B] transition-colors rounded-lg px-4 py-3">

            Cancelar

          </button>

          <button type="button"
            class="bg-[#77575B] text-[#E8EDF3] hover:bg-[#89676B] transition-colors rounded-lg px-4 py-3"
            aria-label="Excluir tarefa">

            🗑

          </button>

        </div>

      </div>

    </aside>

  </main>

</body>
</html>
